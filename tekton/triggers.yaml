apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push-binding
  namespace: trailhead-staging
spec:
  params:
    - name: git-revision
      value: $(body.head_commit.id)
    - name: git-url
      value: $(body.repository.clone_url)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: github-push-template
  namespace: trailhead-staging
spec:
  params:
    - name: git-revision
    - name: git-url
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: trailhead-pipeline-run
        namespace: trailhead-staging
        labels:
          tekton.dev/pipeline: trailhead-platform-pipeline
      spec:
        serviceAccountName: trailhead-pipeline-sa
        pipelineRef:
          name: trailhead-platform-pipeline
        workspaces:
          - name: shared-workspace
            volumeClaimTemplate:
              spec:
                storageClassName: local-sc
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 2Gi
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: github-listener
  namespace: trailhead-staging
spec:
  serviceAccountName: trailhead-pipeline-sa
  triggers:
    - name: github-push-trigger
      interceptors:
        - ref:
            name: "github"
          params:
            - name: "secretRef"
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: "eventTypes"
              value: ["push"]
      bindings:
        - ref: github-push-binding
      template:
        ref: github-push-template
