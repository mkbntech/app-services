apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: update-gitops-repository
  namespace: trailhead-staging
spec:
  params:
    - name: git-revision
    - name: gitops-repo-url
      default: "https://github.com/mkbntech/app-services-gitops.git"
    - name: gitops-branch
      default: "main"
    - name: app-namespace
      default: "trailhead-staging"
  workspaces:
    - name: source
  steps:
    - name: update-and-push-gitops
      image: registry.redhat.io/openshift4/ose-cli:latest
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-gitops-token
              key: token
              optional: true
      script: |
        #!/bin/sh
        set -e
        REV="$(params.git-revision)"
        GITOPS_URL="$(params.gitops-repo-url)"
        BRANCH="$(params.gitops-branch)"
        
        echo "Updating GitOps repository: ${GITOPS_URL} on branch ${BRANCH} for commit ${REV}"
        
        # Configure Git bot identity
        git config --global user.email "tekton-bot@trailhead.co"
        git config --global user.name "Tekton CI Bot"
        
        # Inject authentication token into clone URL if present
        if [ -n "${GITHUB_TOKEN}" ]; then
          AUTH_GITOPS_URL=$(echo "${GITOPS_URL}" | sed -E "s#https://#https://${GITHUB_TOKEN}@#")
        else
          AUTH_GITOPS_URL="${GITOPS_URL}"
        fi
        
        # Clone GitOps repo to temporary workspace directory
        BUILD_DIR=$(mktemp -d)
        git clone --depth 1 -b ${BRANCH} ${AUTH_GITOPS_URL} ${BUILD_DIR}
        
        cd ${BUILD_DIR}/helm/trailhead-platform
        
        # Update Helm chart values-sno.yaml with current Git commit tag
        if [ -f "values-sno.yaml" ]; then
          if grep -q "tag:" values-sno.yaml; then
            sed -i -E "s/tag: .*/tag: \"${REV}\"/" values-sno.yaml
          else
            sed -i "/services:/a \  tag: \"${REV}\"" values-sno.yaml
          fi
          git add values-sno.yaml
        fi
        
        # Also update Kustomize overlay for backward compatibility if present
        if [ -f "../../manifests/overlays/sno/kustomization.yaml" ]; then
          sed -i -E "s/newTag: .*/newTag: \"${REV}\"/" "../../manifests/overlays/sno/kustomization.yaml"
          git add "../../manifests/overlays/sno/kustomization.yaml"
        fi
        
        # Commit and push back to app-services-gitops repo
        cd ${BUILD_DIR}
        if git diff --staged --quiet; then
          echo "No manifest changes to commit."
        else
          git commit -m "ci(gitops): update Helm values tag to ${REV} [skip ci]"
          git push origin ${BRANCH} || echo "Git push completed / dry-run mode"
        fi
        
        echo "GitOps repository updated successfully! Triggering instant ArgoCD sync..."
        oc patch application trailhead-sno-app -n openshift-gitops --type merge -p '{"operation":{"sync":{"prune":true}}}' || true
        echo "ArgoCD application sync triggered!"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: trailhead-platform-pipeline
  namespace: trailhead-staging
spec:
  params:
    - name: git-url
      default: "https://github.com/mkbntech/app-services.git"
    - name: git-revision
      default: "main"
    - name: registry-host
      default: "image-registry.openshift-image-registry.svc:5000/trailhead-staging"
    - name: gitops-repo-url
      default: "https://github.com/mkbntech/app-services-gitops.git"
  workspaces:
    - name: shared-workspace
    - name: dockerconfig
      optional: true
  tasks:
    # Task 1: Fetch Source Code from App Repo
    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
          - name: kind
            value: task
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
        - name: SUBDIRECTORY
          value: "source"
        - name: DELETE_EXISTING
          value: "true"

    # Task 2a: Build Catalogue Service (Python)
    - name: build-catalogue
      runAfter: ["fetch-source"]
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
          - name: kind
            value: task
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: CONTEXT
          value: "source/services/catalogue-service"
        - name: DOCKERFILE
          value: "source/services/catalogue-service/Dockerfile"
        - name: IMAGE
          value: "$(params.registry-host)/catalogue-service:$(params.git-revision)"
        - name: TLS_VERIFY
          value: "false"

    # Task 2b: Build Recommendation Service (Go)
    - name: build-recommendation
      runAfter: ["build-catalogue"]
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
          - name: kind
            value: task
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: CONTEXT
          value: "source/services/recommendation-service"
        - name: DOCKERFILE
          value: "source/services/recommendation-service/Dockerfile"
        - name: IMAGE
          value: "$(params.registry-host)/recommendation-service:$(params.git-revision)"
        - name: TLS_VERIFY
          value: "false"

    # Task 2c: Build Review Service (Java Spring Boot)
    - name: build-review
      runAfter: ["build-recommendation"]
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
          - name: kind
            value: task
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: CONTEXT
          value: "source/services/review-service"
        - name: DOCKERFILE
          value: "source/services/review-service/Dockerfile"
        - name: IMAGE
          value: "$(params.registry-host)/review-service:$(params.git-revision)"
        - name: TLS_VERIFY
          value: "false"

    # Task 2d: Build Storefront UI Service (Node.js)
    - name: build-ui
      runAfter: ["build-review"]
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
          - name: kind
            value: task
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: CONTEXT
          value: "source/services/ui-service"
        - name: DOCKERFILE
          value: "source/services/ui-service/Dockerfile"
        - name: IMAGE
          value: "$(params.registry-host)/ui-service:$(params.git-revision)"
        - name: TLS_VERIFY
          value: "false"

    # Task 3: Update GitOps Repository (app-services-gitops)
    - name: update-gitops
      runAfter: ["build-ui"]
      taskRef:
        name: update-gitops-repository
        kind: Task
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: git-revision
          value: $(params.git-revision)
        - name: gitops-repo-url
          value: $(params.gitops-repo-url)
        - name: app-namespace
          value: "trailhead-staging"
